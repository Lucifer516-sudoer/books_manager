[project]
name = "books-manager"
version = "0.1.0"
description = "A SIMPLE BOOKS MANAGER"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "platformdirs>=4.11.7",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "slugify>=0.0.1",
    "typer>=0.27.2",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "PL",
    "N",
    "RUF",
    "ASYNC",
    "B",
    "S",
    "C4",
    "LOG",
    "PTH",
]
ignore = ["N802"]

[tool.ruff]
line-length = 79 # PEP8 standard
